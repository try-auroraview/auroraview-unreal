name: Unreal plugin build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unreal-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-plugin:
    name: UE ${{ matrix.engine }} Win64 Editor and Runtime build
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, auroraview-unreal]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        engine: ['4.18', '4.26', '5.5', '5.7', '5.8']
    env:
      UE_ROOT: F:\UE\UE_${{ matrix.engine }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select an isolated build output
        shell: pwsh
        run: |
          $buildOutput = Join-Path $env:RUNNER_TEMP 'AuroraView-UE${{ matrix.engine }}-${{ github.run_id }}-${{ github.run_attempt }}'
          "BUILD_OUTPUT=$buildOutput" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build and verify the complete plugin package
        shell: pwsh
        run: |
          python scripts/build_plugin.py --engine-root "$env:UE_ROOT" --engine-version '${{ matrix.engine }}' --require-clean --output "$env:BUILD_OUTPUT"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain package, build receipt and complete UAT log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AuroraView-UE${{ matrix.engine }}-Win64-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ env.BUILD_OUTPUT }}/Package
            ${{ env.BUILD_OUTPUT }}/build-receipt.json
            ${{ env.BUILD_OUTPUT }}/uat.log
            ${{ env.BUILD_OUTPUT }}/uat-logs
            ${{ env.BUILD_OUTPUT }}/HostProject/Saved/Manifest*.xml
            ${{ env.BUILD_OUTPUT }}/HostProject/Plugins/AuroraView/Binaries/Win64/*.target
          if-no-files-found: error
          retention-days: 14
      - name: Cook, package and accept the Development Game Runtime
        shell: pwsh
        run: |
          python scripts/validate_game.py --engine-root "$env:UE_ROOT" --package "$env:BUILD_OUTPUT/Package" --output "$env:BUILD_OUTPUT-Game" --configuration Development --timeout 2400
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain packaged Game acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AuroraView-Game-UE${{ matrix.engine }}-Win64-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ env.BUILD_OUTPUT }}-Game/PackagedGame
            ${{ env.BUILD_OUTPUT }}-Game/evidence
            ${{ env.BUILD_OUTPUT }}-Game/Project/Binaries/Win64/*.exe
            ${{ env.BUILD_OUTPUT }}-Game/Project/Binaries/Win64/*.target
            ${{ env.BUILD_OUTPUT }}-Game/Project/Source
            ${{ env.BUILD_OUTPUT }}-Game/Project/Config
            ${{ env.BUILD_OUTPUT }}-Game/Project/*.uproject
            ${{ env.BUILD_OUTPUT }}-Game/editor-build.*
            ${{ env.BUILD_OUTPUT }}-Game/ubt-editor.*
            ${{ env.BUILD_OUTPUT }}-Game/uat*
          if-no-files-found: warn
          retention-days: 14

      - name: Cook, package and accept the Shipping Game Runtime
        shell: pwsh
        run: |
          python scripts/validate_game.py --engine-root "$env:UE_ROOT" --package "$env:BUILD_OUTPUT/Package" --output "$env:BUILD_OUTPUT-ShippingGame" --configuration Shipping --timeout 2400
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain Shipping Game acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AuroraView-ShippingGame-UE${{ matrix.engine }}-Win64-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ env.BUILD_OUTPUT }}-ShippingGame/PackagedGame
            ${{ env.BUILD_OUTPUT }}-ShippingGame/evidence
            ${{ env.BUILD_OUTPUT }}-ShippingGame/Project/Binaries/Win64/*.exe
            ${{ env.BUILD_OUTPUT }}-ShippingGame/Project/Binaries/Win64/*.target
            ${{ env.BUILD_OUTPUT }}-ShippingGame/Project/Source
            ${{ env.BUILD_OUTPUT }}-ShippingGame/Project/Config
            ${{ env.BUILD_OUTPUT }}-ShippingGame/Project/*.uproject
            ${{ env.BUILD_OUTPUT }}-ShippingGame/editor-build.*
            ${{ env.BUILD_OUTPUT }}-ShippingGame/ubt-editor.*
            ${{ env.BUILD_OUTPUT }}-ShippingGame/uat*
          if-no-files-found: warn
          retention-days: 14
      - name: Retain compact Shipping acceptance receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AuroraView-Shipping-evidence-UE${{ matrix.engine }}-Win64-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ env.BUILD_OUTPUT }}/build-receipt.json
            ${{ env.BUILD_OUTPUT }}-ShippingGame/evidence
          if-no-files-found: warn
          retention-days: 14

      - name: Retain compact acceptance receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AuroraView-evidence-UE${{ matrix.engine }}-Win64-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ env.BUILD_OUTPUT }}/build-receipt.json
            ${{ env.BUILD_OUTPUT }}-Game/evidence
          if-no-files-found: warn
          retention-days: 14

      - name: Bundle the runnable offline UE 5.7 demo
        if: matrix.engine == '5.7'
        shell: pwsh
        run: |
          python scripts/package_demo.py --game-run "$env:BUILD_OUTPUT-Game" --output "$env:BUILD_OUTPUT-Demo"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash -Algorithm SHA256 -LiteralPath "$env:BUILD_OUTPUT-Demo.zip" | ForEach-Object { "$($_.Hash.ToLower())  AuroraView-UE5.7-Win64-Demo.zip" } | Set-Content -LiteralPath "$env:BUILD_OUTPUT-Demo.sha256" -Encoding ascii
      - name: Retain the runnable offline demo
        if: matrix.engine == '5.7'
        uses: actions/upload-artifact@v4
        with:
          name: AuroraView-Demo-UE5.7-Win64-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ env.BUILD_OUTPUT }}-Demo.zip
            ${{ env.BUILD_OUTPUT }}-Demo.sha256
          if-no-files-found: error
          retention-days: 14

  fork-boundary:
    name: Fork build instructions
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Explain the native build boundary
        run: |
          echo 'Fork PRs run the hosted source-contract checks.' >> "$GITHUB_STEP_SUMMARY"
          echo 'A maintainer must review and import the branch before native code runs on the Unreal runner.' >> "$GITHUB_STEP_SUMMARY"
