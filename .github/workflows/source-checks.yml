name: Source contracts (no Unreal build)

on:
  push:
    branches: [main, candidate/**]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-contracts:
    name: Static, mailbox and bridge checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record source-check toolchain
        shell: bash
        run: |
          python3 --version
          c++ --version
          node --version
      - name: Check source and transport contracts
        shell: bash
        run: bash scripts/check.sh
      - name: State native verification boundary
        shell: bash
        run: |
          echo '### Source checks only' >> "$GITHUB_STEP_SUMMARY"
          echo 'This job does not run UHT, UBT, CEF, or the Unreal Editor.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Native results are recorded by the separate Unreal workflow and host acceptance receipts.' >> "$GITHUB_STEP_SUMMARY"

  shared-python-contracts:
    name: Shared Python contracts (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the pinned public tool contracts
        run: python -m pip install "./python[dcc-mcp]" "dcc-mcp-core==0.20.41"
      - name: Check owner dispatch, borrowed tools and demo integration
        run: |
          python tests/native_tools_test.py
          python tests/owner_dispatch_test.py
          python tests/shared_demo_tools_test.py
