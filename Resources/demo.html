<style>
body{font:16px system-ui;background:#101723;color:#edf2ff;margin:32px;max-width:880px}
h1{font-size:28px}p{color:#b8c6dc;line-height:1.5}button{background:#92e4c1;color:#101723;
border:0;border-radius:8px;padding:12px 18px;margin:6px 8px 6px 0;cursor:pointer}
pre{white-space:pre-wrap;background:#1b2637;padding:18px;border-radius:12px;min-height:110px}
.tag{font-size:12px;color:#e5c481}#status{color:#e5c481}
</style>
<span class="tag">SOURCE CANDIDATE · REAL EDITOR VALIDATION REQUIRED</span>
<h1>AuroraView × Unreal Editor</h1>
<p>Native Slate browser, upstream AuroraView bridge, GameThread host dispatch.</p>
<p id="status">Waiting for the native bridge…</p>
<button id="echo" disabled>Echo round trip</button>
<button id="host" disabled>Inspect host thread</button>
<button id="error" disabled>Test host error</button>
<pre id="output">No host call has run yet</pre>
<script>
window.addEventListener('auroraviewready', function () {
  document.getElementById('status').textContent = 'Bridge ready; run a round trip to verify delivery';
  ['echo', 'host', 'error'].forEach(function (id) { document.getElementById(id).disabled = false; });
});
function run(method, params) {
  auroraview.call(method, params).then(function (result) {
    document.getElementById('output').textContent = JSON.stringify(result, null, 2);
  }, function (error) {
    document.getElementById('output').textContent = error.name + ': ' + error.message;
  });
}
document.getElementById('echo').onclick = function () { run('api.echo', {message:'Hello from Slate', unicode:'你好'}); };
document.getElementById('host').onclick = function () { run('unreal.info'); };
document.getElementById('error').onclick = function () { run('demo.error'); };
</script>
