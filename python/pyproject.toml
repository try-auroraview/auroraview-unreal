[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "auroraview-unreal"
version = "0.1.0"
description = "External Python client for the AuroraView Unreal native host"
requires-python = ">=3.9"
license = "MIT"
license-files = ["auroraview_unreal/LICENSE"]
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["auroraview_unreal*"]
